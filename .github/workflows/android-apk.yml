name: Driver app (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/logistics-platform]
    paths: ["ops/mobile/**", ".github/workflows/android-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: ops/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: al-sakhrah-driver-apk
          path: ops/mobile/android/app/build/outputs/apk/debug/app-debug.apk
